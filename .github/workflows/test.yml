name: test

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Instalar dependencias
        run: npm install --ignore-scripts

      - name: Compilar TypeScript
        run: npm run build:ts

      - name: Compilar addon nativo
        run: npm run build:native

      - name: Smoke tests
        env:
          INFINITYSQLITE_PREFER_BUILD: "1"
        run: |
          node smoke-test.js
          node smoke-test-features.js

      - name: Tests
        env:
          INFINITYSQLITE_PREFER_BUILD: "1"
        run: npm test
